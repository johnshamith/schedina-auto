name: Voto sulle scelte (CLV)

# Gira ogni 2 ore: ogni volta guarda solo le partite che stanno per cominciare.
# Cosi funziona anche per quelle di mezzogiorno, e costa pochissime chiamate.
on:
  schedule:
    - cron: '0 8,10,12,14,16,18,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
        run: node clv.mjs
      - run: |
          git config user.name  "schedina-bot"
          git config user.email "bot@users.noreply.github.com"
          git add storico-clv.json
          git diff --staged --quiet || git commit -m "voto $(date -u +%FT%H:%M)"
          git pull --rebase -q && git push
