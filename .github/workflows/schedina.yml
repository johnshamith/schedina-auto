name: Schedina del giorno

on:
  schedule:
    - cron: '0 6 * * *'      # ogni giorno alle 8:00 italiane
  workflow_dispatch:          # e si puo lanciare a mano dal sito

permissions:
  contents: write

jobs:
  scegli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scegli la schedina
        env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
        run: node scegli.mjs

      - name: Salva il risultato
        run: |
          git config user.name  "schedina-bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedina.json
          git diff --staged --quiet || git commit -m "schedina $(date -u +%F)"
          git push
